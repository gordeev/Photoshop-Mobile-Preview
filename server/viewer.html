<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PS Preview">
<meta name="theme-color" content="#000000">
<title>PS Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
    font: 14px -apple-system, system-ui, sans-serif; overflow: hidden;
    -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; overflow: auto; display: flex; touch-action: pan-x pan-y;
    -webkit-user-select: none; user-select: none; scrollbar-width: none; }
  #stage::-webkit-scrollbar { display: none; }
  #img { margin: auto; flex: none; display: none; }
  #wait { margin: auto; text-align: center; padding: 24px; line-height: 1.5; color: #aaa; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #badge { position: fixed; left: 50%; bottom: calc(36px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: rgba(32,32,32,.88); color: #fff; padding: 8px 14px;
    border-radius: 16px; font-size: 14px; white-space: nowrap; max-width: calc(100% - 32px);
    overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; pointer-events: none; opacity: 0; }
  #badge.show { opacity: 1; }
  #badge.err { color: #f77; }
  #menu { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom)); width: min(520px, calc(100% - 20px));
    box-sizing: border-box; background: rgba(22,22,22,.92); border-radius: 18px; padding: 10px 12px 12px; }
  #menu.hidden { display: none; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button { font: inherit; color: #eee; background: rgba(255,255,255,.15); border: 0; border-radius: 18px;
    padding: 8px 14px; cursor: pointer; }
  button.on { background: #2f80ed; }
  button.danger.on { background: #d63b3b; }
  .arrow { font-size: 22px; line-height: 1; padding: 8px 14px; }
  #cutName { flex: 1; text-align: center; min-width: 0; }
  #cutName b { display: block; font-size: 16px; color: #fff; }
  #cutName small { color: #9a9a9a; font-size: 12px; }
  #chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  #chips button { flex: none; padding: 6px 12px; font-size: 13px; }
  .lbl { color: #9a9a9a; font-size: 13px; }
  #menuInfo { color: #8a8a8a; font-size: 12px; }
  .hint { color: #7a7a7a; font-size: 11px; line-height: 1.4; margin-top: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="wait">Waiting for an image from Photoshop…<br><small>Click Start in the Mobile Preview panel<br>Tap the center for the menu</small></div>
  <img id="img" alt="">
</div>
<canvas id="overlay"></canvas>
<div id="badge"></div>
<div id="menu" class="hidden">
  <div id="menuInfo">No image</div>
  <div class="row">
    <button class="arrow" id="prev" aria-label="Previous cutout">‹</button>
    <div id="cutName"><b></b><small></small></div>
    <button class="arrow" id="next" aria-label="Next cutout">›</button>
  </div>
  <div id="chips"></div>
  <div class="row">
    <span class="lbl" id="fitLabel">Fit</span>
    <button id="fitWidth">Width</button>
    <button id="fitHeight">Height</button>
  </div>
  <div class="row">
    <button id="danger" class="danger">Danger zone</button>
    <button id="corners">Screen corners</button>
  </div>
  <div class="hint" id="hint">Tap the left / right edge to switch cutouts<br>Tap the center for the menu · double-tap for 1:1</div>
</div>
<script>
  const img = document.getElementById("img");
  const stage = document.getElementById("stage");
  const wait = document.getElementById("wait");
  const badge = document.getElementById("badge");
  const canvas = document.getElementById("overlay");
  const menu = document.getElementById("menu");
  const $ = (id) => document.getElementById(id);

  const russian = /^ru/i.test(navigator.language || "en");
  const t = (en, ru) => russian ? ru : en;
  document.documentElement.lang = russian ? "ru" : "en";

  $("wait").innerHTML = t("Waiting for an image from Photoshop\u2026<br><small>Click Start in the Mobile Preview panel<br>Tap the center for the menu</small>", "Жду картинку из Photoshop…<br><small>В панели Mobile Preview нажми «Старт»<br>Тап в центре экрана — меню</small>");
  $("menuInfo").innerHTML = t("No image", "Нет картинки");
  $("fitWidth").innerHTML = t("Width", "По ширине");
  $("fitHeight").innerHTML = t("Height", "По высоте");
  $("danger").innerHTML = t("Danger zone", "Опасная зона");
  $("corners").innerHTML = t("Screen corners", "Углы экрана");
  $("fitLabel").textContent = t("Fit", "Вписать");
  $("hint").innerHTML = t("Tap the left / right edge to switch cutouts<br>Tap the center for the menu \u00b7 double-tap for 1:1", "Тап по левому / правому краю — листать вырезы<br>Тап в центре — спрятать меню · двойной тап — 1:1");

  $("prev").setAttribute("aria-label", t("Previous cutout", "Предыдущий вырез"));
  $("next").setAttribute("aria-label", t("Next cutout", "Следующий вырез"));

  // ---------- settings ----------

  const state = { fit: "width", profile: "none", danger: false, corners: true };
  try { Object.assign(state, JSON.parse(localStorage.getItem("psPreview") || "{}")); } catch (e) { /* private mode */ }
  function save() {
    try { localStorage.setItem("psPreview", JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  // ---------- cutout profiles (shared with the Android app) ----------

  let profiles = [{ id: "none", short: t("No cutout", "Без выреза"), kind: t("No cutout", "Без выреза"), device: "", w: 1080, rt: 0, rb: 0, path: "" }];

  function prepare(p) {
    const raw = p.path || "";
    const anchor = /@left/.test(raw) ? "left" : /@right/.test(raw) ? "right" : "center";
    const d = raw.replace(/@\w+/g, "").trim();
    return Object.assign({}, p, {
      short: russian ? p.short : (p.short_en || p.short),
      kind: russian ? p.kind : (p.kind_en || p.kind),
      device: russian ? p.device : (p.device_en || p.device),
      anchor, path2d: d ? new Path2D(d) : null,
    });
  }

  function currentIndex() {
    const i = profiles.findIndex((p) => p.id === state.profile);
    return i < 0 ? 0 : i;
  }

  function title(p) {
    return p.path2d ? `${p.kind} · ${p.device}${p.approx ? " ≈" : ""}` : p.kind;
  }

  // ---------- overlay ----------

  function rotation() {
    let a = typeof window.orientation === "number" ? window.orientation
      : (screen.orientation && screen.orientation.angle) || 0;
    return ((a % 360) + 360) % 360;
  }

  // Matrix from the phone's natural portrait frame (CSS px) to canvas pixels.
  function baseMatrix(W, H, dpr) {
    const m = new DOMMatrix().scaleSelf(dpr, dpr);
    switch (rotation()) {
      case 90: return m.translateSelf(0, H).rotateSelf(-90);   // top of the phone on the left
      case 180: return m.translateSelf(W, H).rotateSelf(180);
      case 270: return m.translateSelf(W, 0).rotateSelf(90);   // top of the phone on the right
      default: return m;
    }
  }

  function profileMatrix(base, p, pw) {
    const s = pw / p.w;
    const ox = p.anchor === "left" ? 0 : p.anchor === "right" ? p.w : p.w / 2;
    return base.scale(s, s).translate(ox, 0);
  }

  function cornerPath(ctx, p, pw, ph) {
    const s = pw / p.w, t = p.rt * s, b = p.rb * s;
    if (t <= 0 && b <= 0) return false;
    ctx.beginPath();
    ctx.rect(0, 0, pw, ph);
    ctx.moveTo(t, 0);
    ctx.lineTo(pw - t, 0);
    ctx.arcTo(pw, 0, pw, t, t);
    ctx.lineTo(pw, ph - b);
    ctx.arcTo(pw, ph, pw - b, ph, b);
    ctx.lineTo(b, ph);
    ctx.arcTo(0, ph, 0, ph - b, b);
    ctx.lineTo(0, t);
    ctx.arcTo(0, 0, t, 0, t);
    ctx.closePath();
    return true;
  }

  function paintShapes(ctx, base, list, pw, ph, color, withCorners) {
    ctx.fillStyle = color;
    for (const p of list) {
      if (withCorners) {
        ctx.setTransform(base);
        if (cornerPath(ctx, p, pw, ph)) ctx.fill("evenodd");
      }
      if (p.path2d) {
        ctx.setTransform(profileMatrix(base, p, pw));
        ctx.fill(p.path2d);
      }
    }
  }

  function drawOverlay() {
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const ctx = canvas.getContext("2d");
    const sideways = rotation() === 90 || rotation() === 270;
    const pw = sideways ? H : W, ph = sideways ? W : H;
    const base = baseMatrix(W, H, dpr);
    const p = profiles[currentIndex()];

    paintShapes(ctx, base, [p], pw, ph, "#000", state.corners);
    if (p.path2d) {
      ctx.setTransform(profileMatrix(base, p, pw));
      ctx.lineWidth = p.w / pw;   // 1 CSS px in the profile's units
      ctx.strokeStyle = "rgba(255,255,255,.2)";
      ctx.stroke(p.path2d);
    }

    if (state.danger) {
      // Union of every cutout: paint them opaque on a scratch canvas, then blend it in once.
      const zone = document.createElement("canvas");
      zone.width = canvas.width; zone.height = canvas.height;
      const z = zone.getContext("2d");
      paintShapes(z, base, profiles, pw, ph, "#ff2020", state.corners);
      // Outline = the zone grown by ~1.5px minus the zone itself.
      const ring = document.createElement("canvas");
      ring.width = canvas.width; ring.height = canvas.height;
      const r = ring.getContext("2d");
      const k = 1.5 * dpr;
      for (const [dx, dy] of [[k, 0], [-k, 0], [0, k], [0, -k], [k, k], [-k, -k], [k, -k], [-k, k]]) {
        r.drawImage(zone, dx, dy);
      }
      r.globalCompositeOperation = "destination-out";
      r.drawImage(zone, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 0.4;
      ctx.drawImage(zone, 0, 0);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(ring, 0, 0);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- picture fitting ----------

  let actual = false;          // double tap: pixel-for-pixel
  let lastSize = "";

  function applyFit(keepScroll) {
    if (!img.naturalWidth) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    let w;
    if (actual) w = nw / (window.devicePixelRatio || 1);
    else if (state.fit === "height") w = H * nw / nh;
    else w = W;
    img.style.width = w + "px";
    img.style.height = (w * nh / nw) + "px";
    if (!keepScroll) {
      stage.scrollLeft = (stage.scrollWidth - W) / 2;
      stage.scrollTop = (stage.scrollHeight - H) / 2;
    }
  }

  function toggleActual(x, y) {
    if (!img.naturalWidth) return;
    // Keep the tapped spot under the finger.
    const oldW = img.offsetWidth, oldH = img.offsetHeight;
    const fx = (stage.scrollLeft + x - img.offsetLeft) / oldW;
    const fy = (stage.scrollTop + y - img.offsetTop) / oldH;
    actual = !actual;
    applyFit(true);
    stage.scrollLeft = img.offsetLeft + fx * img.offsetWidth - x;
    stage.scrollTop = img.offsetTop + fy * img.offsetHeight - y;
    showBadge(actual ? t("1:1 (actual pixels)", "1:1 (пиксель в пиксель)") : (state.fit === "height" ? t("Height", "По высоте") : t("Width", "По ширине")));
  }

  // ---------- menu ----------

  let menuTimer = null;

  function setMenu(visible) {
    menu.classList.toggle("hidden", !visible);
    clearTimeout(menuTimer);
    if (visible) {
      refreshMenu();
      badge.classList.remove("show");
      menuTimer = setTimeout(() => setMenu(false), 10000);
    }
  }

  function refreshMenu() {
    const i = currentIndex(), p = profiles[i];
    $("cutName").querySelector("b").textContent = p.kind;
    $("cutName").querySelector("small").textContent =
      (p.path2d ? `${p.device}${p.approx ? " ≈" : ""} · ` : "") + `${i + 1} ${t("of", "из")} ${profiles.length}`;
    $("fitWidth").classList.toggle("on", state.fit !== "height");
    $("fitHeight").classList.toggle("on", state.fit === "height");
    $("danger").classList.toggle("on", state.danger);
    $("corners").classList.toggle("on", state.corners);
    const chips = $("chips").children;
    for (let k = 0; k < chips.length; k++) chips[k].classList.toggle("on", k === i);
    const chip = chips[i];
    if (chip) $("chips").scrollTo({ left: Math.max(0, chip.offsetLeft - 48), behavior: "smooth" });
  }

  function buildChips() {
    const box = $("chips");
    box.innerHTML = "";
    profiles.forEach((p, i) => {
      const b = document.createElement("button");
      b.textContent = p.short || p.kind;
      b.addEventListener("click", () => select(i, false));
      box.appendChild(b);
    });
  }

  function select(i, announce) {
    const n = profiles.length;
    state.profile = profiles[((i % n) + n) % n].id;
    save();
    drawOverlay();
    if (!menu.classList.contains("hidden")) refreshMenu();
    else if (announce) showBadge(title(profiles[currentIndex()]));
  }

  function step(delta) { select(currentIndex() + delta, true); }

  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("fitWidth").addEventListener("click", () => { state.fit = "width"; actual = false; save(); applyFit(false); refreshMenu(); });
  $("fitHeight").addEventListener("click", () => { state.fit = "height"; actual = false; save(); applyFit(false); refreshMenu(); });
  $("danger").addEventListener("click", () => { state.danger = !state.danger; save(); drawOverlay(); refreshMenu(); });
  $("corners").addEventListener("click", () => { state.corners = !state.corners; save(); drawOverlay(); refreshMenu(); });
  menu.addEventListener("pointerdown", () => {
    clearTimeout(menuTimer);
    menuTimer = setTimeout(() => setMenu(false), 10000);
  });

  // ---------- taps on the picture ----------

  let tapTimer = null;
  stage.addEventListener("click", (e) => {
    if (tapTimer) {
      clearTimeout(tapTimer);
      tapTimer = null;
      toggleActual(e.clientX, e.clientY);
      return;
    }
    const x = e.clientX;
    tapTimer = setTimeout(() => {
      tapTimer = null;
      const W = window.innerWidth;
      if (x < W * 0.25) step(-1);
      else if (x > W * 0.75) step(1);
      else setMenu(menu.classList.contains("hidden"));
    }, 280);
  });

  // ---------- badge ----------

  let badgeTimer = null;
  function showBadge(text, isErr, sticky) {
    badge.textContent = text;
    badge.className = "show" + (isErr ? " err" : "");
    clearTimeout(badgeTimer);
    if (!sticky) badgeTimer = setTimeout(() => badge.classList.remove("show"), 1500);
  }

  // ---------- frames ----------

  let version = 0;
  let objectUrl = null;

  async function loop() {
    for (;;) {
      try {
        const r = await fetch("/frame?v=" + version, { cache: "no-store" });
        if (r.status === 200) {
          version = parseInt(r.headers.get("X-Version") || version + 1, 10);
          const blob = await r.blob();
          const url = URL.createObjectURL(blob);
          await new Promise((res) => { img.onload = res; img.onerror = res; img.src = url; });
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = url;
          wait.style.display = "none";
          img.style.display = "block";
          const size = img.naturalWidth + "x" + img.naturalHeight;
          applyFit(size === lastSize);   // same document: keep where the user scrolled
          lastSize = size;
          $("menuInfo").textContent = t("Frame received at ", "Кадр получен ") + new Date().toLocaleTimeString();
        } else if (r.status === 204) {
          const v = parseInt(r.headers.get("X-Version") || "0", 10);
          if (v < version) version = 0; // server restarted
        }
        if (badge.classList.contains("err")) badge.classList.remove("show", "err");
      } catch (e) {
        showBadge(t("No connection to the computer\u2026", "Нет связи с компьютером…"), true, true);
        await new Promise((res) => setTimeout(res, 2000));
      }
    }
  }

  function relayout() {
    applyFit(false);
    drawOverlay();
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", () => setTimeout(relayout, 300));

  fetch("/cutouts.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((list) => { profiles = list.map(prepare); })
    .catch(() => { profiles = profiles.map(prepare); })
    .finally(() => { buildChips(); drawOverlay(); refreshMenu(); });

  loop();
</script>
</body>
</html>
